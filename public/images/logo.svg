<svg xmlns="http://www.w3.org/2000/svg" width="360" height="140" viewBox="0 0 360 140">
  <!-- Blue square background -->
  <rect x="10" y="20" width="90" height="90" rx="18" fill="#1E88E5"/>

  <!-- Robot head -->
  <rect x="28" y="38" width="54" height="54" rx="12" fill="#FFFFFF"/>

  <!-- Robot ears (side bumps) -->
  <rect x="22" y="52" width="8" height="26" rx="4" fill="#FFFFFF"/>
  <rect x="82" y="52" width="8" height="26" rx="4" fill="#FFFFFF"/>

  <!-- Eyes -->
  <circle cx="46" cy="65" r="6" fill="#000000"/>
  <circle cx="64" cy="65" r="6" fill="#000000"/>

  <!-- Antenna -->
  <line x1="55" y1="38" x2="55" y2="26" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="55" cy="20" r="5" fill="#FFFFFF"/>

  <!-- Text: Xinghua AI (larger) -->
  <text x="120" y="85"
        font-family="Arial, sans-serif"
        font-size="48"
        font-weight="bold"
        fill="#000000">
    Xinghua AI
  </text>
</svg>
